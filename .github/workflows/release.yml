name: Release

on:
  push:
    tags:
      - "v*"

# Required for:
# - Pushing to GitHub Releases (this repo)
# - Pushing formula to homebrew-hookset repo
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # GITHUB_TOKEN is built-in and has write access to this repo
          # For pushing to homebrew-hookset, goreleaser needs a token
          # with access to that repo. Use the same token since you're
          # the owner of both repos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
