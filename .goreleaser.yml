version: 2

project_name: hookset

before:
  hooks:
    - go mod tidy

builds:
  - id: hookset
    main: ./cmd/hookset
    binary: hookset
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/bulga138/hookset/internal/version.Version={{.Version}}
      - -X github.com/bulga138/hookset/internal/version.Commit={{.Commit}}
      - -X github.com/bulga138/hookset/internal/version.BuildTime={{.Date}}

archives:
  - id: hookset
    ids: [hookset]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  # Also publish individual per-archive .sha256 files so the install script
  # can verify each download independently without parsing checksums.txt.
  extra_files:
    - glob: "dist/*.sha256"

# Per-archive SHA-256 files — generated in the before hook (see Makefile target
# `make release-checksums`) or by goreleaser's own checksums mechanism.
# The install script downloads hookset_<version>_<os>_<arch>.tar.gz.sha256
# alongside the archive and verifies before extracting.

release:
  github:
    owner: bulga138
    name: hookset
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: hookset
    binaries:
      - hookset
    ids:
      - hookset
    repository:
      owner: bulga138
      name: homebrew-hookset
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://bulga138.github.io/hookset"
    description: "Git 2.54 config-native hook manager — no Husky, no lint-staged"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/hookset"]
          end
    skip_upload: auto